version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: finrag_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finrag}
      POSTGRES_USER: ${POSTGRES_USER:-finrag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finrag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finrag_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finrag_user} -d ${POSTGRES_DB:-finrag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finrag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finrag.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - tools

volumes:
  finrag_postgres_data:
    driver: local
